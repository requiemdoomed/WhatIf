<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Explore the decisions that make a different world. An interactive narrative experiment by Swayam Shakya.">
  <title>WhatIf — One Decision. Infinite Possibilities.</title>
  <script src="static/js/theme.js"></script>
  <link rel="stylesheet" href="static/css/style.css">
  <script src="static/js/entry.js" defer></script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="header">
    <a class="wordmark" href="#home" aria-label="WhatIf home">WhatIf<span>↗</span></a>
    <nav aria-label="Main navigation">
      <a href="#explore">Explore</a><a href="#journeys">My Journeys</a><a href="#lab">Timeline Lab</a><a href="#achievements">Achievements</a><a href="#settings">Settings</a>
    </nav>
    <button id="audio-toggle" class="icon" aria-label="Play soundtrack" title="Play soundtrack">♫</button>
    <button id="theme" class="icon" aria-label="Switch color theme" title="Switch color theme">◐</button>
  </header>
  <main id="main" tabindex="-1"><p class="loading">Opening the possibilities…</p></main>
  <footer><a class="wordmark" href="#home">WhatIf<span>↗</span></a><p>An experiment in choices & consequences.</p><p>Created by <strong>Swayam Shakya</strong> · 2026</p></footer>
  <aside class="audio-dock" aria-label="Soundtrack controls">
    <span id="audio-status">Sound off</span>
    <label for="audio-volume">Volume</label>
    <input id="audio-volume" type="range" min="0" max="100" value="35" aria-label="Soundtrack volume">
  </aside>
  <template id="local-startup">
    <section class="panel startup-panel">
      <p class="eyebrow">WhatIf · Ready when you are</p>
      <h1>One small step into another world.</h1>
      <p>This is the main interface. Start the included Python server to connect your stories, saved journeys and music.</p>
      <ol>
        <li><strong>Windows:</strong> double-click <code>START_WINDOWS.bat</code> in this folder.</li>
        <li><strong>macOS:</strong> open Terminal in this folder and run <code>bash START_MAC_LINUX.sh</code>. The same command works on Linux.</li>
      </ol>
      <p>The launcher prepares a private environment and opens the game automatically. Python 3.10 or newer is required; the first setup needs internet access. Keep the terminal open while playing.</p>
      <div class="actions"><a class="primary" href="http://127.0.0.1:5050/index.html">Open running game ↗</a><a class="text-link" href="README.md">Setup instructions</a></div>
      <details><summary>Prefer the notebook?</summary><p>Run <code>python run.py --notebook</code> (or <code>python3 run.py --notebook</code> on macOS). In <code>whatif_notebook.ipynb</code>, run the launch cells, then follow the game link. Both launch methods use the same stories and database.</p></details>
      <p class="small">The HTML file cannot start Python itself. Nothing is missing: the included launcher connects the complete project. If using a custom port, open the address printed in your terminal.</p>
    </section>
  </template>
  <noscript><p>Enable JavaScript to explore the stories and use the game controls.</p></noscript>
  <div id="toast" role="status" aria-live="polite"></div>
  <dialog id="confirm-dialog" aria-labelledby="dialog-title"><form method="dialog">
    <h2 id="dialog-title">Start again?</h2><p id="dialog-description"></p>
    <label id="reset-label" hidden>Type RESET<input id="reset-word" autocomplete="off"></label>
    <div class="actions"><button value="cancel">Cancel</button><button id="confirm-action" value="ok" class="primary">Confirm</button></div>
  </form></dialog>
</body>
</html>
